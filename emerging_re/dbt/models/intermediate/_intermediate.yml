version: 2

models:
  - name: int_universe
    description: >
      The screener's target universe: counties with population >= 50,000
      that have both FHFA HPI and Zillow ZORI history. One row per county.
      Expected size ~500-600 (from ~1,010 pop>=50k counties, narrowed by
      ZORI coverage).
    columns:
      - name: fips
        description: "2020 census FIPS code, 5-digit."
        tests:
          - not_null
          - unique
      - name: pop_latest
        tests:
          - not_null

  - name: int_migration_3yr_accel
    description: >
      Tier 1 demand signal: per-capita net domestic migration + 3yr
      acceleration. `domesticmig_accel_3yr` positive = accelerating
      inflows relative to prior 3-year average.
    columns:
      - name: fips
        tests: [not_null]
      - name: period_end_date
        tests: [not_null]

  - name: int_high_wage_share
    description: >
      Tier 1 demand signal: fraction of total employment in NAICS
      supersectors 51+52+54+55 (Info, Finance, Prof Services, Mgmt).
    columns:
      - name: fips
        tests: [not_null]
    # Bounded-share sanity check needs dbt_utils.expression_is_true;
    # deferred to Batch F when packages.yml gets added.

  - name: int_wage_growth_yoy
    description: >
      Tier 1 demand signal: YoY change in QCEW county avg annual pay,
      demeaned vs universe median for the same period.
    columns:
      - name: fips
        tests: [not_null]
      - name: wage_growth_yoy_demeaned
        tests: [not_null]

  - name: int_employment_growth_yoy
    description: >
      Tier 1 demand signal: YoY change in QCEW county total employment,
      demeaned vs universe median for the same period.
    columns:
      - name: fips
        tests: [not_null]
      - name: emp_growth_yoy_demeaned
        tests: [not_null]

  - name: int_permits_intensity
    description: >
      Tier 2 supply signal: current-year permits/1000 residents vs the
      county's own 10-year historical average. Ratio > 1 = supply
      catching up; ratio < 1 = supply constrained. `permits_10yr_baseline_years_available`
      flags data-thin counties (BPS coverage cliff — see DECISIONS.md §3).
    columns:
      - name: fips
        tests: [not_null]
      - name: period_end_date
        tests: [not_null]

  - name: int_rent_vs_price_growth
    description: >
      Tier 3 pricing signal — the framework's "most important single
      criterion" per DECISIONS.md. Emits YoY HPI growth, YoY ZORI Dec-
      to-Dec growth, and their difference. Positive gap = rent
      outpacing price (yields expanding, entry window); negative gap =
      price outpacing rent (late cycle, yields compressing).
    columns:
      - name: fips
        tests: [not_null]
      - name: period_end_date
        tests: [not_null]
      - name: rent_minus_price_growth
        tests: [not_null]
