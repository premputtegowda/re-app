version: 2

# External sources = Parquet files written by the Phase 1 ingest loaders.
# dbt-duckdb's `external_location` meta lets staging models reference them
# via `{{ source('curated', '<table>') }}` — expanded into read_parquet()
# calls that respect the as_of_date hive partition.
#
# `curated_dir` is defined in dbt_project.yml vars.
sources:
  - name: curated
    description: >
      Curated Parquet outputs from ingest loaders. Each source is
      hive-partitioned by as_of_date, giving us bitemporal history —
      downstream models can filter to a single vintage for point-in-time
      backtests or aggregate across vintages for latest-known values.
    meta:
      external_location: >-
        read_parquet('{{ var("curated_dir") }}/{name}/**/*.parquet',
          hive_partitioning=1)
    tables:
      - name: fhfa_hpi
        description: "Annual county HPI (all-transactions), 1975-present."
      - name: zillow_zori
        description: "Monthly county rent index (ZORI), 2015-present."
      - name: census_pep
        description: "Annual county population + components of change (2010-present across two vintages)."
      - name: census_bps
        description: "Annual county building permits (2000-present)."
      - name: bls_qcew
        description: "Annual county employment + wages by NAICS supersector (2000-present)."
      - name: census_acs
        description: >
          ACS 5-year rolling estimates — county-level median income, median
          rent ($), median home value, rental vacancy rate. Level metrics
          for UI context (not composite scoring — see v4 experiment result
          in _scoring.py). Vintages 2019-2024 loaded.
      - name: census_bfs
        description: >
          Annual county Business Applications counts (2005-2025). Leading
          indicator: new business apps precede employer formation by 4-8
          quarters. Publish lag ~5 months.
      - name: census_acs_1yr
        description: >
          ACS 1-year estimates — calendar-year snapshots (not smoothed).
          Only counties with pop >= 65,000 (~861 counties). Preferred
          over 5yr when available; int_acs_features falls back to 5yr
          for smaller counties. Vintage 2020 unavailable (Census
          cancelled due to pandemic sample issues).
      - name: hud_fmr
        description: >
          HUD Fair Market Rents — county-level, annual (FY). Set at 40th
          percentile of standard-quality rentals. Section 8 usage is
          heavily MF, so FMR is a better MF-rent proxy than Zillow ZORI
          (which blends SFR + condo + MF). 2BR FMR is our primary MF
          rent signal. Loaded FY2019-FY2026. Free via HUD API.
      - name: bls_laus
        description: >
          BLS Local Area Unemployment Statistics — county-level, monthly.
          One row per fips with latest unemployment_rate + 12mo change.
          Free via BLS bulk file, no auth. ~1-3 month publish lag.
      - name: irs_soi_migration
        description: >
          IRS Statistics of Income county-to-county migration flows,
          tax-return based. Emits per-county inflow + outflow returns,
          exemptions, and AGI ($ thousands) plus derived AGI-per-return
          (income of movers-in / out) and net metrics. 4 annual vintages
          loaded (tax years 2020-2023).
      - name: fema_nri
        description: >
          FEMA National Risk Index v1.20 — county-level composite natural
          hazard risk. Overall risk + 17 individual hazards (hurricane,
          wildfire, coastal flood, earthquake, etc.). Manual download
          required (Akamai WAF blocks programmatic access); refreshed
          ~annually.

  - name: backtest
    description: >
      Outputs from backtest/run_backtest.py. Not partitioned — a fresh
      run overwrites (backtest history isn't tracked here; git history
      of the scoring code is the source of truth for what the model
      was on any given day).
    meta:
      external_location: >-
        read_parquet('{{ var("curated_dir") }}/backtest/{name}/*.parquet')
    tables:
      - name: scores
        description: "Per-(fips, period) composite score, rank, and tier contributions."
      - name: diagnostics
        description: "Per-(experiment, target, regime) Spearman correlation + sample size."
