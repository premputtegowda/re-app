version: 2

models:
  - name: mart_hpi_forward_returns_24mo
    description: >
      Target A per DECISIONS.md §7: forward 24-month FHFA HPI change,
      demeaned cross-sectionally vs the national median per period.
      One row per (fips, period_end_date) where a valid +24mo HPI reading
      exists. Annual cadence.
    columns:
      - name: fips
        tests: [not_null]
      - name: period_end_date
        tests: [not_null]
      - name: target_hpi_24mo_demeaned
        tests: [not_null]
    # Composite-key uniqueness test needs dbt_utils; deferring to Batch F
    # when we install packages.yml and pull in the full test kit.

  - name: mart_zori_forward_returns_24mo
    description: >
      Target B per DECISIONS.md §7: forward 24-month Zillow ZORI change,
      demeaned cross-sectionally vs the national median per period.
      One row per (fips, period_end_date) where a valid +24mo ZORI reading
      exists. Monthly cadence.
    columns:
      - name: fips
        tests: [not_null]
      - name: period_end_date
        tests: [not_null]
      - name: target_zori_24mo_demeaned
        tests: [not_null]

  - name: mart_county_features
    description: >
      The Phase 2 output — one wide row per (fips, period_end_date, Dec 31)
      combining every intermediate feature with both forward-return targets
      (HPI 24mo demeaned, ZORI 24mo demeaned). This is the table Phase 3
      backtest feeds into a scoring function. Features are raw (not
      standardized); z-scoring happens at scoring time so each backtest
      fold uses its own universe.
    columns:
      - name: fips
        tests: [not_null]
      - name: period_end_date
        tests: [not_null]

  - name: mart_backtest_scores
    description: >
      Per-(fips, period_end_date) composite score + rank + tier
      contributions + individual z-scored feature contributions.
      Written by backtest/run_backtest.py. Consumed by UI county-detail
      view.
    columns:
      - name: fips
        tests: [not_null]
      - name: period_end_date
        tests: [not_null]

  - name: mart_backtest_current
    description: >
      Latest-period scoring per county — the UI's main landing page
      reads this. One row per fips.
    columns:
      - name: fips
        tests:
          - not_null
          - unique

  - name: mart_backtest_diagnostics
    description: >
      Per-(experiment, target, regime) Spearman correlation + n.
      Consumed by backtest performance page in UI + the ship-decision
      logic.
    columns:
      - name: experiment
        tests: [not_null]
      - name: target
        tests: [not_null]
      - name: regime
        tests: [not_null]

  - name: mart_county_context
    description: >
      Per-county $-denominated context metrics for the UI county-detail
      page. Latest ACS 5-year vintage: median household income, median
      gross rent, median home value, rental vacancy rate. Plus derived
      metrics: cap_rate_proxy (rent × 12 / home value) and
      rent_to_income_ratio.
    columns:
      - name: fips
        tests:
          - not_null
          - unique
