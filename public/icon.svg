<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#3B82F6"/>

  <!-- House roof -->
  <path d="M256 120 L100 260 L140 260 L140 400 L372 400 L372 260 L412 260 Z" fill="white"/>

  <!-- Door -->
  <rect x="224" y="310" width="64" height="90" rx="6" fill="#3B82F6"/>
  <circle cx="276" cy="358" r="5" fill="white" opacity="0.7"/>

  <!-- Window left -->
  <rect x="155" y="280" width="50" height="45" rx="5" fill="#3B82F6" opacity="0.25"/>
  <line x1="180" y1="280" x2="180" y2="325" stroke="white" stroke-width="2.5"/>
  <line x1="155" y1="302" x2="205" y2="302" stroke="white" stroke-width="2.5"/>

  <!-- Window right -->
  <rect x="307" y="280" width="50" height="45" rx="5" fill="#3B82F6" opacity="0.25"/>
  <line x1="332" y1="280" x2="332" y2="325" stroke="white" stroke-width="2.5"/>
  <line x1="307" y1="302" x2="357" y2="302" stroke="white" stroke-width="2.5"/>

  <!-- Stock-style trend line going up across the house -->
  <polyline points="90,395 160,370 210,380 260,320 310,290 350,240 400,150"
    stroke="#10B981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Arrow head -->
  <path d="M400,150 L385,180 L415,175 Z" fill="#10B981"/>
</svg>
